<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#173d34" />
    <title>文流 · 暂时离线</title>
    <style>
      :root { color-scheme: light; font-family: ui-serif, "Songti SC", "Noto Serif CJK SC", serif; background: #e8dfc3; color: #1b3e34; }
      * { box-sizing: border-box; }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 32px; background: radial-gradient(circle at 30% 10%, #f7f0d8, transparent 42%), #e8dfc3; }
      main { width: min(100%, 560px); padding: 48px 36px; border: 1px solid rgba(27, 62, 52, .22); background: rgba(250, 244, 221, .76); box-shadow: 0 24px 80px rgba(32, 49, 40, .13); }
      small { letter-spacing: .18em; }
      h1 { margin: 18px 0 12px; font-size: clamp(34px, 8vw, 58px); }
      p { font-size: 18px; line-height: 1.8; }
      a { display: inline-block; margin-top: 18px; color: inherit; text-underline-offset: 5px; }
    </style>
  </head>
  <body>
    <main>
      <small>WENLIU · OFFLINE</small>
      <h1>暂时离线</h1>
      <p>已经读过的文章仍可继续打开。网络恢复后，文流会自动取得最新内容。</p>
      <a href="./">返回文章库</a>
    </main>
  </body>
</html>
